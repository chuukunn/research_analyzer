<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>統合版：論文分析＆文章構成システム</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/noUiSlider/15.7.1/nouislider.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/noUiSlider/15.7.1/nouislider.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap');

        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            overflow: hidden;
            font-size: 14px;
        }

        .dragging {
            opacity: 0.4;
            border: 2px dashed #4f46e5;
        }

        .auto-resize-textarea {
            resize: none;
            overflow: hidden;
            min-height: 40px;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* --- Layout --- */
        .main-container {
            display: flex;
            height: 100vh;
        }

        .panel {
            padding: 1rem;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow-y: auto;
            transition: width 0.3s ease-in-out;
        }

        .panel-left {
            width: 65%;
            border-right: 1px solid #e2e8f0;
        }

        .panel-right {
            width: 35%;
            position: relative;
        }

        /* Collapsed state for right panel */
        .panel-right.collapsed {
            width: 60px;
            padding-left: 0.5rem;
            padding-right: 0.5rem;
        }

        .panel-right.collapsed .editor-content-wrapper {
            display: none;
        }

        .panel-left.expanded {
            width: calc(100% - 60px);
        }

        svg {
            border: 1px solid #ccc;
            width: 100%;
            height: 100%;
            background: #fff;
            border-radius: 4px;
        }

        .link {
            stroke: #999;
            stroke-opacity: 0.6;
        }

        .link.highlight {
            stroke: #f00;
            stroke-width: 1.5px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            padding: 4px;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color: 0.2s;
        }

        .legend-item:hover,
        .legend-item.highlight-hover {
            background-color: #f0f0f0;
        }

        .legend-item.active {
            background-color: #dbeafe;
        }

        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
            flex-shrink: 0;
        }

        /* --- Document Panel --- */
        .component {
            margin-bottom: 8px;
            border-radius: 6px;
        }

        .component-content {
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            background-color: #ffffff;
        }

        .component-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 8px;
            background-color: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            border-radius: 6px 6px 0 0;
        }

        .component-body {
            padding: 8px;
        }

        .prose-textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            margin-top: 8px;
            background-color: #ffffff;
        }

        .sortable-ghost {
            background: #eef2ff;
            border: 2px dashed #818cf8;
        }

        .component-children-container .sortable-ghost {
            margin: 4px;
        }

        /* --- Main Tab Styles --- */
        .tab-button {
            padding: 8px 16px;
            cursor: pointer;
            border: none;
            background-color: transparent;
            border-bottom: 3px solid transparent;
            font-weight: 600;
            color: #64748b;
            /* slate-500 */
            transition: all 0.2s ease-in-out;
        }

        .tab-button:hover {
            color: #4338ca;
            /* indigo-700 */
        }

        .tab-button.active {
            color: #4f46e5;
            /* indigo-600 */
            border-bottom-color: #4f46e5;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        /* --- Control Panel Tab Styles (不再使用) --- */
        .control-tab-button {
            padding: 6px 12px;
            cursor: pointer;
            border: none;
            background-color: transparent;
            border-bottom: 2px solid transparent;
            font-weight: 500;
            color: #64748b;
            transition: all 0.2s ease-in-out;
        }

        .control-tab-button:hover {
            color: #4338ca;
        }

        .control-tab-button.active {
            color: #4f46e5;
            border-bottom-color: #4f46e5;
        }

        .control-tab-content {
            display: none;
        }

        .control-tab-content.active {
            display: block;
        }

        /* --- Selection Panel --- */
        .selection-tag {
            display: inline-flex;
            align-items: center;
            background-color: #e0e7ff;
            color: #3730a3;
            padding: 2px 8px;
            border-radius: 9999px;
            font-size: 12px;
            margin: 2px;
        }

        .author-tag {
            cursor: pointer;
            transition: color 0.2s;
        }

        .author-tag:hover {
            text-decoration: underline;
        }

        .author-tag.highlight {
            font-weight: 700;
            color: #c2410c;
        }

        .author-tag.faint {
            color: #94a3b8;
            cursor: default;
        }

        .author-tag.faint:hover {
            text-decoration: none;
        }

        /* --- Compact Slider Styles --- */
        .compact-slider-container .noUi-target {
            height: 8px;
        }

        .compact-slider-container .noUi-handle {
            width: 16px;
            height: 16px;
            right: -8px;
            top: -5px;
            border-radius: 50%;
        }

        .compact-slider-container .noUi-connect {
            background: #4f46e5;
        }

        .compact-slider-container label {
            font-size: 11px;
        }
    </style>
</head>

<body class="bg-slate-100 text-slate-800">

    <div class="main-container">

        <!-- =================================================================
         左パネル: 論文可視化システム
    ================================================================== -->
        <div id="panel-left" class="panel panel-left">
            <!-- Header -->
            <div class="vis-header flex-shrink-0 flex justify-between items-start space-x-4">
                <h1 class="text-2xl font-bold text-indigo-600 mb-2 whitespace-nowrap">論文分析ツール</h1>

                <!-- 論文取得設定 (ヘッダー右側に移動, 枠なし) -->
                <div class="flex-shrink-0 w-3/5 pt-1">
                    <div class="space-y-2">
                        <div class="flex items-center space-x-2">
                            <div class="flex flex-col w-32">
                                <label for="dataSourceSelect"
                                    class="mb-1 font-medium text-slate-700 text-xs">データソース</label>
                                <select id="dataSourceSelect"
                                    class="w-full border-gray-300 rounded-md shadow-sm text-xs p-1.5">
                                    <option value="openalex" selected>OpenAlex</option>
                                    <option value="semantic_scholar">Semantic Scholar</option>
                                </select>
                            </div>
                            <div class="flex flex-col flex-grow">
                                <label for="aid" class="mb-1 font-medium text-slate-700 text-xs">著者ID</label>
                                <input id="aid" type="text" value="a5022699013"
                                    class="w-full border-gray-300 rounded-md shadow-sm text-xs p-1.5">
                            </div>
                            <div class="flex flex-col w-28">
                                <label for="max_papers" class="mb-1 font-medium text-slate-700 text-xs">最大論文数</label>
                                <input id="max_papers" type="number" value="5000" min="50" max="10000" step="50"
                                    class="w-full border-gray-300 rounded-md shadow-sm text-xs p-1.5">
                            </div>
                            <div class="flex flex-col w-24">
                                <label for="min_abs_len" class="mb-1 font-medium text-slate-700 text-xs">最小要旨長</label>
                                <input id="min_abs_len" type="number" value="50" min="0" max="500" step="10"
                                    class="w-full border-gray-300 rounded-md shadow-sm text-xs p-1.5">
                            </div>
                            <button id="refetchAndAnalyzeButton"
                                class="self-end bg-indigo-600 text-white font-semibold py-1.5 px-3 rounded-md hover:bg-indigo-700 text-xs">論文を再取得して分析</button>

                        </div>
                    </div>
                </div>
            </div>

            <!-- Main Content (Controls + Visualization) -->
            <div class="flex-grow flex mt-2 overflow-hidden min-h-0">
                <!-- Controls (タブを削除し、両方表示) -->
                <div class="vis-controls text-sm w-1/4 pr-4 flex flex-col">

                    <!-- タブを削除し、両方のコンテンツを単一のコンテナに配置 -->
                    <div
                        class="control-content-container flex-grow bg-white p-2 min-h-0 overflow-y-auto border rounded-md">

                        <!-- 1: Analysis Parameters -->
                        <div id="analysis-params-content" class="space-y-4">
                            <fieldset>
                                <div class="space-y-2 text-xs">
                                    <div>
                                        <label for="clusteringModelSelect"
                                            class="font-medium text-slate-700">クラスタリング</label>
                                        <select id="clusteringModelSelect"
                                            class="w-full border-gray-300 rounded-md shadow-sm p-1 mt-1">
                                            <option value="hdbscan" selected>HDBSCAN</option>
                                            <option value="kmeans">K-Means</option>
                                        </select>
                                        <!-- 削除された要素の代わりに非表示のselectを追加 -->
                                        <select id="embeddingModelSelect" class="hidden">
                                            <option value="simcse"></option>
                                        </select>
                                        <select id="dimRedModelSelect" class="hidden">
                                            <option value="umap"></option>
                                        </select>
                                    </div>
                                    <!-- Cluster Count Input (Unified for both HDBSCAN and K-Means) -->
                                    <div id="kmeans-k-container" class="flex flex-col mt-2">
                                        <!-- ★ 修正: IDを追加し、JSからラベルを変更可能にする -->
                                        <label id="cluster-param-label" for="kmeansKInput"
                                            class="mb-1 font-medium text-slate-700">最小クラスターサイズ (Min Cluster
                                            Size)</label>
                                        <input id="kmeansKInput" type="number" value="5" min="2" max="100" step="1"
                                            class="w-full border-gray-300 rounded-md shadow-sm text-xs p-1.5">
                                    </div>
                                </div>
                            </fieldset>
                            <fieldset class="compact-slider-container pt-2">
                                <div class="space-y-4">
                                    <!-- General parameters -->
                                    <!-- General parameters -->
                                    <div class="flex flex-col">
                                        <!-- time_weight removed -->
                                    </div>

                                    <!-- Citation Network Layout -->
                                    <div class="flex flex-col space-y-4">
                                        <div class="flex flex-col">
                                            <label class="mb-2 font-medium text-slate-700">Year Gap (Vertical): <span
                                                    id="citationVerticalGapValue">30</span>px</label>
                                            <div id="citationVerticalGapSlider"></div>
                                        </div>
                                        <div class="flex flex-col">
                                            <label class="mb-2 font-medium text-slate-700">Line Width (Horizontal):
                                                <span id="citationHorizontalWidthValue">800</span>px</label>
                                            <div id="citationHorizontalWidthSlider"></div>
                                        </div>
                                    </div>

                                    <!-- Dimensionality Reduction specific parameters (UMAP only) -->
                                    <div id="dim-red-params-container">
                                        <div id="umap-params" class="space-y-4">
                                            <div class="flex flex-col">
                                                <label class="mb-2 font-medium text-slate-700">n_neighbors (UMAP): <span
                                                        id="neighborsValue">15</span></label>
                                                <div id="neighborsSlider"></div>
                                            </div>
                                            <div class="flex flex-col">
                                                <label class="mb-2 font-medium text-slate-700">min_dist (UMAP): <span
                                                        id="minDistValue">0.10</span></label>
                                                <div id="minDistSlider"></div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </fieldset>
                            <button id="reanalyzeButton"
                                class="w-full bg-slate-500 text-white font-semibold py-1.5 px-2 rounded-md hover:bg-slate-600 text-xs mt-4">分析を再実行</button>
                        </div>

                    </div>
                </div>

                <!-- Visualization Area with Tabs -->
                <div class="flex-grow flex flex-col w-3/4">
                    <!-- Main Tabs -->
                    <div id="tabs-container" class="flex border-b border-gray-200">
                        <button data-tab-target="#umap-view" class="tab-button active">論文埋め込み</button>
                        <button data-tab-target="#temporal-keyword-view" class="tab-button">トピック変遷</button>
                        <button data-tab-target="#citation-view" class="tab-button">引用関係図</button>
                        <button data-tab-target="#coauthor-view" class="tab-button">共著ネットワーク</button>
                        <button data-tab-target="#synthesis-view" class="tab-button">文章生成</button>
                    </div>

                    <!-- Tab Content -->
                    <div
                        class="tab-content-container flex-grow relative bg-white border-r border-b border-l border-gray-200 rounded-b-md min-h-0">
                        <div id="umap-view" data-tab-content class="tab-content active">
                            <div class="flex flex-grow min-h-0">
                                <div class="w-1/4 p-2 border-r border-slate-200 overflow-y-auto">
                                    <div id="umap-legend-container" class="mt-1" style="display: none;">
                                        <h3 class="font-semibold mb-1 text-sm flex-shrink-0">トピック分布</h3>
                                        <div id="legend-pie-chart"
                                            class="w-full flex-shrink-0 flex justify-center items-center"
                                            style="height: 160px;"></div>
                                    </div>
                                    <!-- トピック数表示のみ残す（オプション） -->
                                    <div class="mt-4 px-2 text-xs text-slate-500">
                                        <span class="font-medium">検出トピック数:</span> <span id="topicCountDisplay">0</span>
                                    </div>
                                </div>
                                <!-- Visualization Area -->
                                <div id="svg-container" class="w-3/4 p-2 h-full"><svg id="mainNet"></svg></div>
                            </div>
                        </div>
                        <div id="temporal-keyword-view" data-tab-content class="tab-content">
                            <!-- Content will be generated by temporal-keyword.js -->
                        </div>
                        <div id="citation-view" data-tab-content class="tab-content">
                            <div id="citation-container" class="w-full flex-grow p-2">
                                <svg id="citationNet"></svg>
                            </div>
                        </div>
                        <div id="coauthor-view" data-tab-content class="tab-content">
                            <div id="coauthor-container" class="w-full flex-grow">
                                <!-- coauthor-network.js がこの要素の *中身* を構築する -->
                            </div>
                        </div>
                        <div id="synthesis-view" data-tab-content class="tab-content p-4">
                            <button id="generate-synthesis-btn"
                                class="bg-indigo-600 text-white font-semibold py-2 px-4 rounded-md hover:bg-indigo-700 self-start mb-4">構成から文章を生成</button>
                            <div id="synthesis-output"
                                class="prose prose-sm max-w-none w-full h-full overflow-y-auto bg-slate-50 p-4 rounded-md">
                                <p class="text-slate-500">右の文章構成ツールにブロックを配置し、「構成から文章を生成」ボタンを押してください。</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Selection & Info Panels -->
            <div class="flex-shrink-0 border-t mt-2 pt-2 flex gap-4">
                <div class="w-1/2">
                    <h3 class="font-semibold mb-1 text-sm flex justify-between items-center">
                        現在選択されている論文
                        <button id="exclude-selected-btn"
                            class="bg-red-50 text-red-600 border border-red-200 hover:bg-red-100 text-xs px-2 py-0.5 rounded transition-colors hidden">
                            選択を除外して再分析
                        </button>
                    </h3>
                    <div id="selection-panel" class="bg-slate-50 p-2 rounded-md h-28 overflow-y-auto text-xs">選択なし</div>
                </div>
                <div class="w-1/2">
                    <h3 class="font-semibold mb-1 text-sm">選択の詳細</h3>
                    <div id="info-panel" class="bg-slate-50 p-2 rounded-md h-28 overflow-y-auto text-xs">論文を選択してください。
                    </div>
                </div>
            </div>
        </div>

        <!-- =================================================================
         右パネル: 文章構成システム
    ================================================================== -->
        <div id="panel-right" class="panel panel-right">
            <button id="screenshotButton" class="absolute top-4 right-14 p-2 text-slate-500 hover:text-slate-800 z-10"
                title="スクリーンショットを保存">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                    <circle cx="12" cy="13" r="4"></circle>
                </svg>
            </button>
            <button id="collapse-editor-btn" class="absolute top-4 right-4 p-2 text-slate-500 hover:text-slate-800 z-10"
                title="パネルを折りたたむ">
                <svg id="collapse-icon-open" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                    viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
                <svg id="collapse-icon-closed" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                    viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round" class="hidden">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </button>

            <div class="editor-content-wrapper flex flex-col h-full">
                <div class="panel-header flex justify-between items-center mb-4 flex-shrink-0">
                    <h1 class="text-2xl font-bold text-slate-700">文章構成ツール</h1>
                </div>
                <div class="panel-content flex flex-col flex-grow">
                    <div class="flex justify-between items-center mb-4">
                        <div class="flex items-center space-x-2">
                            <button id="add-paragraph-btn"
                                class="bg-white border border-slate-300 text-slate-600 font-semibold py-1 px-3 rounded-md hover:bg-slate-50 text-xs flex items-center space-x-1">
                                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <path d="M17 6.1H3" />
                                    <path d="M21 12.1H3" />
                                    <path d="M15.1 18H3" />
                                </svg>
                                <span>パラグラフ追加</span>
                            </button>
                            <!-- Folder Dropdown -->
                            <div class="relative inline-block text-left" id="template-dropdown-container">
                                <button id="add-folder-dropdown-btn" type="button"
                                    class="bg-white border border-slate-300 text-slate-600 font-semibold py-1 px-3 rounded-md hover:bg-slate-50 text-xs flex items-center space-x-1">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
                                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                        stroke-linejoin="round">
                                        <path
                                            d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z">
                                        </path>
                                    </svg>
                                    <span>フォルダー追加</span>
                                    <svg class="ml-1 h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"
                                        fill="currentColor">
                                        <path fill-rule="evenodd"
                                            d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"
                                            clip-rule="evenodd" />
                                    </svg>
                                </button>
                                <div id="template-dropdown-menu"
                                    class="origin-top-right absolute right-0 mt-2 w-56 rounded-md shadow-lg bg-white ring-1 ring-black ring-opacity-5 focus:outline-none hidden z-10"
                                    role="menu" aria-orientation="vertical">
                                    <div class="py-1" role="none">
                                        <p class="px-4 pt-2 pb-1 text-xs text-slate-500 font-semibold">テンプレートから作成</p>
                                        <a href="#" class="text-slate-700 block px-4 py-2 text-sm hover:bg-slate-100"
                                            role="menuitem" data-template-type="A">A: 標準的な時系列型</a>
                                        <a href="#" class="text-slate-700 block px-4 py-2 text-sm hover:bg-slate-100"
                                            role="menuitem" data-template-type="B">B: 業績中心型</a>
                                        <a href="#" class="text-slate-700 block px-4 py-2 text-sm hover:bg-slate-100"
                                            role="menuitem" data-template-type="C">C: コンセプト解説型</a>
                                        <div class="border-t my-1 border-slate-200"></div>
                                        <a href="#" class="text-slate-700 block px-4 py-2 text-sm hover:bg-slate-100"
                                            role="menuitem" id="add-single-folder-btn">
                                            空のフォルダーを追加
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- ★ 修正: 全体的な設定（スタイルと焦点） -->
                    <div class="flex justify-start items-center space-x-4 mb-4 p-3 bg-slate-50 rounded-lg border">
                        <div>
                            <label for="generation-style-select"
                                class="block text-xs font-medium text-slate-700 mb-1">文章スタイル</label>
                            <select id="generation-style-select"
                                class="bg-white border border-slate-300 text-slate-600 font-semibold py-1 px-3 rounded-md hover:bg-slate-50 text-xs"
                                title="文章生成のスタイルを選択">
                                <option value="academic_expert">専門家向け (厳密)</option>
                                <option value="academic_general">専門外学者向け (明快)</option>

                        <div>

                    </div>
                </div>
            </div>
